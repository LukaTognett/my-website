<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Перекуп — симулятор рынка. Покупай дешевле, продавай дороже.">
<title>Перекуп</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root, [data-theme="light"] {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #f1f3f6;
    --surface-3: #e8ebef;
    --text: #0f172a;
    --text-2: #475569;
    --text-3: #94a3b8;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-soft: #dbeafe;
    --green: #059669;
    --green-soft: #d1fae5;
    --red: #dc2626;
    --red-soft: #fee2e2;
    --yellow: #d97706;
    --yellow-soft: #fef3c7;
    --purple: #7c3aed;
    --purple-soft: #ede9fe;
    --border: #e2e8f0;
    --border-2: #cbd5e1;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
    --bubble-other: #f1f3f6;
    --bubble-me: #2563eb;
    --bubble-me-text: #ffffff;
  }
  [data-theme="dark"] {
    --bg: #0a0e14;
    --surface: #151b25;
    --surface-2: #1c2430;
    --surface-3: #252e3d;
    --text: #f1f5f9;
    --text-2: #94a3b8;
    --text-3: #64748b;
    --primary: #60a5fa;
    --primary-hover: #93c5fd;
    --primary-soft: #1e3a5f;
    --green: #34d399;
    --green-soft: #064e3b;
    --red: #f87171;
    --red-soft: #7f1d1d;
    --yellow: #fbbf24;
    --yellow-soft: #78350f;
    --purple: #a78bfa;
    --purple-soft: #3b1e6e;
    --border: #232d3d;
    --border-2: #344256;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    --shadow: 0 1px 3px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.2);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.4), 0 2px 4px rgba(0,0,0,.2);
    --bubble-other: #1c2430;
    --bubble-me: #2563eb;
    --bubble-me-text: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
    height: 100dvh; padding-top: env(safe-area-inset-top);
    font-size: 14px; -webkit-font-smoothing: antialiased;
    transition: background .2s, color .2s;
  }
  button { will-change: transform; }
  .app-header { flex-shrink: 0; padding: 12px 16px 10px; background: var(--bg); border-bottom: 1px solid var(--border); }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .app-title { font-size: 17px; font-weight: 700; letter-spacing: -.02em; display: flex; align-items: center; gap: 6px; }
  .app-title .dot-live { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
  .header-stats { display: flex; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; }
  .chip.money { background: var(--green-soft); color: var(--green); border-color: transparent; }
  .chip.money.neg { background: var(--red-soft); color: var(--red); }
  .chip.rep { background: var(--purple-soft); color: var(--purple); border-color: transparent; }
  .chip.day { color: var(--text-2); }
  .progress-info { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--text-3); font-weight: 500; margin-bottom: 4px; }
  .progress-track { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--green)); transition: width .4s ease; border-radius: 999px; }
  .banner { display: flex; align-items: center; gap: 8px; padding: 8px 12px; margin-top: 8px; border-radius: 10px; font-size: 12px; font-weight: 500; }
  .banner.event { background: var(--yellow-soft); color: var(--yellow); }
  .banner.debt { background: var(--red-soft); color: var(--red); }
  .app-main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 16px 24px; overscroll-behavior: contain; }
  .panel { display: flex; flex-direction: column; gap: 10px; }
  .section-title { font-size: 12px; font-weight: 600; color: var(--text-2); letter-spacing: .02em; padding: 4px 2px 2px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-sm); }
  .card.onboarding { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); animation: pulseBorder 2s infinite; }
  @keyframes pulseBorder { 0%,100% { box-shadow: 0 0 0 3px var(--primary-soft); } 50% { box-shadow: 0 0 0 6px var(--primary-soft); } }
  .card-top { display: flex; gap: 12px; align-items: flex-start; }
  .emoji-box { width: 46px; height: 46px; flex-shrink: 0; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; font-size: 24px; line-height: 1; }
  .emoji-box.tech { background: var(--primary-soft); }
  .emoji-box.home { background: var(--yellow-soft); }
  .emoji-box.sport { background: var(--green-soft); }
  .emoji-box.hobby { background: var(--purple-soft); }
  .emoji-box.fashion { background: var(--red-soft); }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 700; font-size: 15px; color: var(--text); line-height: 1.25; }
  .cond { font-size: 12px; color: var(--text-3); margin-top: 3px; line-height: 1.35; }
  .tags-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tag { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 6px; font-size: 10px; font-weight: 600; white-space: nowrap; }
  .tag-defect { background: var(--red-soft); color: var(--red); }
  .tag-demand { background: var(--yellow-soft); color: var(--yellow); }
  .tag-order { background: var(--primary-soft); color: var(--primary); }
  .tag-black { background: var(--purple-soft); color: var(--purple); }
  .tag-season { background: var(--surface-2); color: var(--text-2); }
  .tag-rare { background: var(--primary-soft); color: var(--primary); }
  .tag-premium { background: var(--yellow-soft); color: var(--yellow); }
  .tag-story { background: var(--surface-2); color: var(--text-2); }
  .tag-risk { background: var(--red-soft); color: var(--red); }
  .tag-profit { background: var(--green-soft); color: var(--green); }
  .rows { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--text-2); }
  .row b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row b.good { color: var(--green); }
  .row b.bad { color: var(--red); }
  .row b.warn { color: var(--yellow); }
  .actions { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .actions button { flex: 1; min-width: 0; }
  button {
    font-family: inherit; font-weight: 600; font-size: 14px;
    border-radius: 12px; border: none;
    background: var(--surface-2); color: var(--text);
    padding: 11px 16px; min-height: 44px; cursor: pointer;
    transition: transform .08s, background .15s, opacity .15s;
    touch-action: manipulation;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-buy { background: var(--green); color: #fff; }
  .btn-sell { background: var(--primary); color: #fff; }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-ghost { background: transparent; color: var(--text-2); padding: 8px 12px; min-height: 36px; font-size: 13px; }
  .btn-full { width: 100%; padding: 14px; font-size: 15px; }
  .btn-sm { padding: 6px 12px; min-height: 34px; font-size: 12px; border-radius: 10px; }
  .empty { text-align: center; padding: 40px 20px; color: var(--text-3); font-size: 13px; line-height: 1.5; }
  .bottom-nav { flex-shrink: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: var(--surface); border-top: 1px solid var(--border); padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
  .nav-btn { background: none; color: var(--text-3); padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: inherit; font-size: 10px; font-weight: 500; min-height: 52px; cursor: pointer; position: relative; transition: color .15s; border-radius: 12px; }
  .nav-btn .ico { font-size: 20px; line-height: 1; transition: transform .15s; }
  .nav-btn.active { color: var(--primary); }
  .nav-btn.active .ico { transform: scale(1.1); }
  .nav-btn.active::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 24px; height: 3px; background: var(--primary); border-radius: 0 0 3px 3px; }
  .nav-btn .dot { position: absolute; top: 8px; right: 24%; width: 8px; height: 8px; border-radius: 50%; background: var(--red); display: none; box-shadow: 0 0 0 2px var(--surface); }
  .nav-btn .dot.on { display: block; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 50; animation: fadeIn .2s ease; backdrop-filter: blur(2px); }
  .modal.hidden { display: none; }
  @keyframes fadeIn { from { opacity: 0; } }
  .sheet { width: 100%; max-width: 500px; background: var(--surface); border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; max-height: 92dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; animation: slideUp .28s cubic-bezier(.2,.8,.3,1); }
  @keyframes slideUp { from { transform: translateY(100%); } }
  .drag-handle { width: 36px; height: 4px; background: var(--border-2); border-radius: 2px; margin: 0 auto 8px; flex-shrink: 0; }
  .sheet h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
  .hint { font-size: 12px; color: var(--text-3); line-height: 1.45; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; border-left: 3px solid var(--primary); }
  .chat-header { display: flex; align-items: center; gap: 12px; padding: 4px 0 12px; border-bottom: 1px solid var(--border); }
  .chat-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 24px; flex-shrink: 0; }
  .chat-name { font-weight: 700; font-size: 15px; }
  .chat-status { font-size: 11px; color: var(--green); display: flex; align-items: center; gap: 4px; }
  .chat-status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chat-status.offline { color: var(--text-3); }
  .chat-messages { display: flex; flex-direction: column; gap: 10px; padding: 8px 0; max-height: 40dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; transition: max-height .2s ease; }
  .chat-messages.compact { max-height: 12dvh; }
  .msg { display: flex; gap: 8px; align-items: flex-end; animation: msgIn .25s ease; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } }
  .msg.me { flex-direction: row-reverse; }
  .msg-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 16px; flex-shrink: 0; }
  .msg-bubble { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; background: var(--bubble-other); color: var(--text); border-bottom-left-radius: 4px; word-wrap: break-word; }
  .msg.me .msg-bubble { background: var(--bubble-me); color: var(--bubble-me-text); border-bottom-left-radius: 16px; border-bottom-right-radius: 4px; }
  .chat-actions { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); }
  .quick-offers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .quick-offers button { padding: 10px 4px; font-size: 13px; background: var(--surface-2); font-weight: 700; }
  .quick-offers button:disabled { opacity: .3; }
  /* ===== CUSTOM KEYBOARD ===== */
  .custom-keyboard { display: flex; flex-direction: column; gap: 8px; }
  .keyboard-display { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; text-align: center; }
  .keyboard-label { font-size: 11px; color: var(--text-3); font-weight: 500; margin-bottom: 4px; }
  .keyboard-value { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); min-height: 32px; line-height: 1.2; }
  .keyboard-value.empty { color: var(--text-3); font-size: 22px; }
  .keyboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .key-btn { padding: 12px 4px; font-size: 20px; font-weight: 700; border-radius: 10px; background: var(--surface-2); color: var(--text); min-height: 46px; }
  .key-btn:active:not(:disabled) { background: var(--surface-3); transform: scale(.96); }
  .key-action { color: var(--text-2); font-size: 16px; }
  .keyboard-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 2px; }
  .keyboard-submit { padding: 14px; font-size: 15px; }
  /* ===== MISC ===== */
  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--surface); color: var(--text); padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; z-index: 99; max-width: 85vw; text-align: center; box-shadow: var(--shadow-lg); border: 1px solid var(--border); animation: toastUp .3s cubic-bezier(.2,.8,.3,1); pointer-events: none; }
  .toast.success { background: var(--green); color: #fff; border-color: transparent; }
  .toast.error { background: var(--red); color: #fff; border-color: transparent; }
  .toast.reward { background: var(--purple); color: #fff; border-color: transparent; }
  @keyframes toastUp { from { opacity: 0; transform: translate(-50%, 20px); } }
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .stat-mini { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
  .stat-mini .l { font-size: 11px; color: var(--text-3); font-weight: 500; }
  .stat-mini .v { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
  .rank-card { background: linear-gradient(135deg, var(--purple), var(--primary)); color: #fff; border-radius: 16px; padding: 24px 16px; text-align: center; box-shadow: var(--shadow); }
  .rank-emoji { font-size: 44px; line-height: 1; margin-bottom: 4px; }
  .rank-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .rank-desc { font-size: 12px; opacity: .85; font-weight: 500; }
  .level-bar { display: flex; gap: 4px; margin-top: 12px; }
  .level-seg { flex: 1; height: 4px; background: rgba(255,255,255,.25); border-radius: 2px; }
  .level-seg.on { background: rgba(255,255,255,.95); }
  .ach-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .ach { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 3px; align-items: center; text-align: center; opacity: .35; }
  .ach.unlocked { opacity: 1; border-color: var(--yellow); background: var(--yellow-soft); }
  .ach-emoji { font-size: 22px; line-height: 1; }
  .ach-name { font-size: 11px; font-weight: 700; line-height: 1.2; }
  .ach-desc { font-size: 10px; color: var(--text-3); line-height: 1.25; }
  .skill-branch { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .skill-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
  .skill-nodes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .skill-node { border-radius: 10px; padding: 10px 6px; font-size: 10px; text-align: center; line-height: 1.3; background: var(--surface-2); color: var(--text-3); font-weight: 600; display: flex; flex-direction: column; gap: 2px; align-items: center; min-height: 64px; justify-content: center; border: 1.5px solid transparent; }
  .skill-node.active { background: var(--green-soft); color: var(--green); border-color: var(--green); }
  .skill-node.next { border-style: dashed; border-color: var(--primary); color: var(--primary); cursor: pointer; }
  .skill-node .lvl { font-size: 15px; }
  .skill-node .lbl { font-size: 9px; }
  .mg-title { text-align: center; font-size: 16px; font-weight: 700; }
  .mg-round { text-align: center; font-size: 12px; color: var(--text-3); margin-bottom: 8px; }
  .mg-dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
  .mg-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--surface-2); transition: background .2s; }
  .mg-dot.hit { background: var(--yellow); }
  .mg-dot.perfect { background: var(--green); }
  .mg-dot.miss { background: var(--red); }
  .mg-dot.current { background: var(--primary); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); } }
  .mg-bar { position: relative; height: 68px; background: var(--surface-2); border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
  .mg-zone-good { position: absolute; top: 0; bottom: 0; background: var(--yellow-soft); }
  .mg-zone-perfect { position: absolute; top: 0; bottom: 0; background: var(--green-soft); display: flex; align-items: center; justify-content: center; }
  .mg-zone-perfect::after { content: '⭐'; font-size: 18px; opacity: .6; }
  .mg-cursor { position: absolute; top: -2px; bottom: -2px; width: 6px; margin-left: -3px; background: var(--primary); border-radius: 3px; box-shadow: 0 0 0 2px var(--surface), 0 0 12px var(--primary); z-index: 2; will-change: left; }
  .mg-result { text-align: center; font-size: 14px; font-weight: 700; padding: 10px; border-radius: 12px; min-height: 44px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
  .mg-result.perfect { background: var(--green-soft); color: var(--green); }
  .mg-result.good { background: var(--yellow-soft); color: var(--yellow); }
  .mg-result.miss { background: var(--red-soft); color: var(--red); }
  .mg-result.empty { background: transparent; color: var(--text-3); font-weight: 500; }
  .mg-summary { text-align: center; }
  .mg-summary .big { font-size: 56px; line-height: 1; margin-bottom: 8px; }
  .mg-summary .txt { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .mg-summary .sub { font-size: 12px; color: var(--text-3); margin-bottom: 14px; }
  .theme-switcher { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; background: var(--surface-2); border-radius: 12px; }
  .theme-btn { padding: 10px; border-radius: 10px; background: transparent; color: var(--text-2); font-size: 13px; font-weight: 600; min-height: 40px; }
  .theme-btn.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
  .bonus-toast { position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%); background: var(--surface); border-radius: 20px; padding: 24px 32px; text-align: center; font-size: 15px; font-weight: 600; z-index: 200; box-shadow: var(--shadow-lg), 0 0 0 1px var(--border); animation: bonusPop .5s cubic-bezier(.2,.8,.3,1); min-width: 220px; }
  .bonus-toast .amt { font-size: 28px; color: var(--green); margin: 8px 0; font-weight: 800; }
  @keyframes bonusPop { from { opacity: 0; transform: translate(-50%, -50%) scale(.7); } 60% { transform: translate(-50%, -50%) scale(1.05); } }
  .install-hint { background: var(--primary-soft); color: var(--primary); border-radius: 12px; padding: 12px 14px; font-size: 12px; line-height: 1.45; font-weight: 500; margin-bottom: 4px; }
  .tutorial-card { background: var(--surface); border: 1px solid var(--primary); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .tutorial-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .tutorial-steps { font-size: 13px; line-height: 1.6; color: var(--text-2); }
  .tutorial-steps span { color: var(--primary); font-weight: 600; margin-right: 4px; }
  .season-indicator { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; font-size: 12px; color: var(--text-2); }
  .season-indicator b { color: var(--text); }
  .splash { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeIn .3s; }
  .splash.hidden { display: none; }
  .splash-content { text-align: center; max-width: 340px; width: 100%; }

let audioCtx = null;
function playSound(type) {
  if (!S.soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    let freq = 440, dur = 0.08;
    if (type === 'click') { freq = 620; dur = 0.05; }
    else if (type === 'key') { freq = 740; dur = 0.03; }
    else if (type === 'buy') { freq = 520; dur = 0.1; }
    else if (type === 'sell') { freq = 880; dur = 0.12; }
    else if (type === 'error') { freq = 220; dur = 0.15; }
    else if (type === 'ach') { freq = 1320; dur = 0.2; }
    else if (type === 'perfect') { freq = 1760; dur = 0.15; }
    else if (type === 'good') { freq = 1046; dur = 0.1; }
    else if (type === 'message') { freq = 480; dur = 0.06; }
    o.frequency.value = freq; o.type = 'sine';
    g.gain.setValueAtTime(0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

function setTheme(theme) {

}

function save() {
  if (!SafeStorage.available) return;
  try { SafeStorage.set(SAVE_KEY, JSON.stringify({ ...S, _v: 8 })); } catch(e) {}
}
function load() {
  const raw = SafeStorage.get(SAVE_KEY);
  if (!raw) return false;
  try {
    const d = JSON.parse(raw);
    if (d._v !== 8) return false;
    delete d._v;
    S = { ...defaultState(), ...d };
    S.up = { ...defaultState().up, ...(d.up || {}) };
    S.stats = { ...defaultState().stats, ...(d.stats || {}) };
    S.skills = { ...defaultState().skills, ...(d.skills || {}) };
    S.achievements = d.achievements || {};
    const ids = [...S.market, ...S.inv, ...S.storage].map(x => x.id || 0);
    idc = ids.length ? Math.max(...ids) : 0;
    chat = null; repairGame = null;
    return true;
  } catch(e) { return false; }
}

/* =========================================================
   GENERATION
   ========================================================= */
function makeLot(forceTier) {
  const t = pick(ITEMS);
  const condition = rnd(0.55, 1.0);
  const seasonMult = currentSeason().mods[t.cat] || 1;
  let tier = forceTier || 'common';
  if (!forceTier) {
    if (S.transport >= 2 && Math.random() < 0.03) tier = 'premium';
    else if (S.transport >= 1 && Math.random() < 0.08) tier = 'rare';
  }
  const tierMult = tier === 'premium' ? 2.5 : tier === 'rare' ? 1.5 : 1;
  const marketValue = round100(t.base * condition * seasonMult * tierMult);
  const defect = Math.random() < 0.18;
  let trueValue = defect ? round100(marketValue * 0.55) : marketValue;
  let askPrice = round100(marketValue * rnd(0.58, 0.9));
  if (S.event && S.event.effect === 'cheapMarket') askPrice = round100(askPrice * S.event.mult);
  let story = null;
  if (tier === 'common' && Math.random() < 0.25) {
    story = pick(STORIES);
    askPrice = round100(askPrice * story.priceMult);
    trueValue = round100(trueValue * story.trueMult);
  }
  let estimate = round100(marketValue * rnd(0.8, 1.2));
  if (S.skills.inspect >= 2) estimate = round100(marketValue * rnd(0.92, 1.08));
  return {
    id: ++idc, name: t.name, emoji: t.emoji, cat: t.cat,
    condition, marketValue, trueValue, defect,
    askPrice, estimate, inspected: false, tier, story,
  };
}
function makeBlack() {
  const it = makeLot();
  it.isBlack = true;
  it.askPrice = round100(it.askPrice * 0.65);
  it.scamChance = 0.30;
  return it;
}
function makeOrder() {
  if (S.orders.filter(o => !o.done && !o.failed).length >= 3) return;
  const t = pick(ITEMS);
  const bonus = rnd(0.15, 0.30);
  const baseValue = round100(t.base * rnd(0.9, 1.1));
  S.orders.push({
    id: ++idc, name: t.name, emoji: t.emoji,
    reward: round100(baseValue * (1 + bonus)),
    deadline: S.day + ri(3, 5),
    bonus: Math.round(bonus * 100),
    done: false, failed: false,
  });
}
function newMarket() {
  S.dailyDemand = Math.random() < 0.4 ? pick(ITEMS) : null;
  S.market = Array.from({ length: marketSize() }, () => makeLot());
  if (S.day % 7 === 0) S.market.push(makeBlack());
}
function makePallet() {
  S.pallet = { id: ++idc, size: ri(3, 5), price: round100(rnd(12000, 40000)), day: S.day };
}

function unlockAch(id) {
  if (S.achievements[id]) return;
  S.achievements[id] = true;
  const a = ACHIEVEMENTS.find(x => x.id === id);
  if (a) {
    S.skillPoints += a.points;
    toast(`🏅 ${a.name} · +${a.points} SP`, 'success');
    playSound('ach'); haptic(30);
    track('achievement', { id });
  }
}
function checkAch() {
  const st = S.stats;
  if (st.deals >= 1) unlockAch('first_sale');
  if (st.deals >= 10) unlockAch('ten_sales');
  if (st.deals >= 50) unlockAch('fifty_sales');
  if (st.deals >= 100) unlockAch('hundred_sales');
  if (st.bestDeal >= 30000) unlockAch('big_deal');
  if (st.cleanStreak >= 5) unlockAch('no_defects_5');
  if (st.ordersDone >= 1) unlockAch('first_order');
  if (st.repairsDone >= 1) unlockAch('first_repair');
  if (S.money >= 1000000) unlockAch('million');
  if (S.rep >= 100) unlockAch('rep_max');
  if (bizLevel() >= 2) unlockAch('biz2');
  if (bizLevel() >= 4) unlockAch('biz4');
}
function updateBizLevel() {
  const newLvl = bizLevel();
  if (newLvl > S.lastBizLevel) {
    S.lastBizLevel = newLvl;
    S.skillPoints += 1;
    const bl = BUSINESS_LEVELS[newLvl];
    setTimeout(() => {
      toast(`${bl.emoji} ${bl.name}! +1 SP`, 'reward');
      haptic(50);
      track('level_up', { level: newLvl });
    }, 400);
  }
}

function inspectLot(id) {
  const it = S.market.find(x => x.id === id);
  if (!it || it.inspected) return;
  const cost = inspectCost(it.askPrice);
  if (S.money < cost) return;
  S.money -= cost;
  it.inspected = true;
  if (it.defect) { S.stats.defectsFound++; playSound('error'); haptic(20); toast('Найден дефект!', 'error'); }
  else { playSound('click'); toast('Всё чисто'); }
  if (S.onboardingStep === 1) S.onboardingStep = 2;
  track('inspect', { defect: it.defect });
  render();
}

/* =========================================================
   CHAT — BUY
   ========================================================= */
function startBuyChat(itemId) {
  const it = S.market.find(x => x.id === itemId);
  if (!it) return;
  if (S.inv.length >= invLimit()) { toast('Инвентарь полон', 'error'); return; }
  if (S.money < it.askPrice * 0.7) { toast('Слишком мало денег', 'error'); return; }
  let sellerType = pick(SELLER_TYPES);
  if (it.story) {
    if (it.story.id === 'granny' || it.story.id === 'urgent') sellerType = SELLER_TYPES.find(t => t.id === 'desperate');
    else if (it.story.id === 'collector') sellerType = SELLER_TYPES.find(t => t.id === 'firm');
  }
  if (it.isBlack) sellerType = SELLER_TYPES.find(t => t.id === 'greedy');
  chat = {
    type: 'buy',
    item: it, seller: sellerType,
    currentPrice: it.askPrice,
    minPrice: round100(it.askPrice * (1 - sellerType.maxDiscount)),
    patience: sellerType.patience,
    messages: [{ from: 'other', text: sellerType.greeting(it) }],
    completed: false, abandoned: false,
    keyboardOpen: false, keyboardValue: '',
    pending: false,
  };
  track('chat_buy_open');
  renderChat();
}

/* =========================================================
   CHAT — SELL
   ========================================================= */
function startSellChat(itemId) {
  const it = S.inv.find(x => x.id === itemId);
  if (!it || chat) return;
  const buyer = pickBuyer();
  let repMult = 0.9 + S.rep / 500;
  if (S.up.vip) repMult += 0.1;
  if (S.skills.trade >= 1) repMult += 0.03;
  if (S.skills.trade >= 2) repMult += 0.03;
  if (S.skills.trade >= 3) repMult += 0.04;
  const demandMult = (S.dailyDemand && it.name === S.dailyDemand.name) ? 1.3 : 1;
  const eventMult = (S.event && S.event.effect === 'sellBoost' && S.event.cat === it.cat) ? S.event.mult : 1;
  const eventAll = (S.event && S.event.effect === 'sellBoostAll') ? S.event.mult : 1;
  let buyerPrice = it.trueValue * buyer.priceMult * repMult * demandMult * eventMult * eventAll;
  if (buyer.detectsDefects && it.defect) buyerPrice *= 0.7;
  const maxPrice = round100(buyerPrice);
  const offer = round100(maxPrice * rnd(0.72, 0.9));
  chat = {
    type: 'sell',
    item: it, buyer,
    currentPrice: offer, maxPrice,
    raises: 0,
    maxRaises: buyer.maxRaises + (S.up.negotiation ? 1 : 0),
    messages: [{ from: 'other', text: buyer.greeting(it, offer) }],
    completed: false, abandoned: false,
    keyboardOpen: false, keyboardValue: '',
    pending: false,
  };
  track('chat_sell_open');
  renderChat();
}
function pickBuyer() {
  const pool = [];
  BUYERS.forEach(b => { const w = b.weight || 1; for (let i = 0; i < Math.round(w * 10); i++) pool.push(b); });
  return pick(pool);
}

   ========================================================= */
function renderChat() {
  if (!chat) { closeSheet(); return; }
  const c = chat;
  const who = c.type === 'buy' ? c.seller : c.buyer;
  const title = c.type === 'buy' ? 'Продавец' : who.name;
  const status = c.abandoned ? 'оффлайн' : 'в сети';
  const messagesHtml = c.messages.map(m => `
    <div class="msg ${m.from === 'me' ? 'me' : 'other'}">
      ${m.from === 'other' ? `<div class="msg-avatar">${who.emoji}</div>` : ''}
      <div class="msg-bubble">${m.text}</div>
    </div>`).join('');

  let actionsHtml = '';
  if (c.completed) {
    const btnText = c.type === 'buy' ? `Купить за ${fmt(c.currentPrice)}` : `Продать за ${fmt(c.currentPrice)}`;
    const btnClass = c.type === 'buy' ? 'btn-buy' : 'btn-sell';
    actionsHtml = `<button class="${btnClass} btn-full" onclick="finalizeChat()">${btnText}</button>`;
  } else if (c.abandoned) {
    actionsHtml = `<button class="btn-ghost btn-full" onclick="closeSheet()">Закрыть</button>`;
  } else if (c.keyboardOpen) {
    actionsHtml = renderKeyboard();
  } else if (c.type === 'buy') {
    const p = c.currentPrice;
    const quick = QUICK_STEPS.map(s => {
      const np = p - s;
      const disabled = np < 100;
      return `<button ${disabled ? 'disabled' : `onclick="playerOfferBuy(${np})"`}>−${s}</button>`;
    }).join('');
    actionsHtml = `
      <button class="btn-buy btn-full" onclick="playerOfferBuy(${p})" ${c.pending ? 'disabled' : ''}>✓ Взять за ${fmt(p)}</button>
      <div class="quick-offers">${quick}</div>
      <button class="btn-primary btn-full" onclick="openCustomKeyboard()">✏️ Своя цена</button>
      <button class="btn-ghost btn-sm" onclick="leaveChat()">Уйти</button>`;
  } else {
    const p = c.currentPrice;
    const quick = QUICK_STEPS.map(s => {
      const np = p + s;
      return `<button onclick="playerCounterSell(${np})">+${s}</button>`;
    }).join('');
    actionsHtml = `
      <button class="btn-sell btn-full" onclick="playerAcceptSell(${p})" ${c.pending ? 'disabled' : ''}>✓ Продать за ${fmt(p)}</button>
      <div class="quick-offers">${quick}</div>
      <button class="btn-primary btn-full" onclick="openCustomKeyboard()">✏️ Своя цена</button>
      <button class="btn-ghost btn-sm" onclick="leaveChat()">Уйти</button>`;
  }

  const messagesClass = 'chat-messages' + (c.keyboardOpen ? ' compact' : '');

  showSheet(`
    <div class="drag-handle"></div>
    <div class="chat-header">
      <div class="chat-avatar">${who.emoji}</div>
      <div style="flex:1">
        <div class="chat-name">${title}</div>
        <div class="chat-status ${c.abandoned ? 'offline' : ''}">${status}</div>
      </div>
      <div style="text-align:right;font-size:11px;color:var(--text-3)">
        Товар<br><b style="color:var(--text);font-size:13px">${fmt(c.currentPrice)}</b>
      </div>
    </div>
    <div class="${messagesClass}" id="chatMessages">${messagesHtml}</div>
    <div class="chat-actions">${actionsHtml}</div>
  `);

  requestAnimationFrame(() => {
    const box = document.getElementById('chatMessages');
    if (box) box.scrollTop = box.scrollHeight;
  });
}

function updateKeyboardDisplay() {

function appendMessage(from, text) {
  if (!chat) return;
  chat.messages.push({ from, text });
  const box = document.getElementById('chatMessages');
  if (!box) { renderChat(); return; }
  const who = chat.type === 'buy' ? chat.seller : chat.buyer;
  const div = document.createElement('div');
  div.className = 'msg ' + (from === 'me' ? 'me' : 'other');
  div.innerHTML = (from === 'other' ? `<div class="msg-avatar">${who.emoji}</div>` : '') +
    `<div class="msg-bubble">${text}</div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  playSound('message');
}
function updateChatUI() {
  if (!chat) return;
  renderChat();
}

/* =========================================================
   OFFERS
   ========================================================= */
function playerOfferBuy(amount) {
  const c = chat;
  if (!c || c.completed || c.abandoned || c.pending || c.keyboardOpen) return;
  amount = Math.max(100, Math.round(amount));
  c.pending = true;
  const snapshot = c;

  if (c.currentPrice === amount && amount <= c.item.askPrice) {
    appendMessage('me', `Беру за ${fmt(amount)}`);
    setTimeout(() => {
      if (chat !== snapshot) return;
      c.pending = false;
      appendMessage('other', c.seller.accept);
      c.completed = true;
      updateChatUI();
    }, 400);
    return;
  }

  appendMessage('me', `Предлагаю ${fmt(amount)}`);
  setTimeout(() => {
    if (chat !== snapshot) return;
    c.pending = false;
    if (amount >= c.minPrice) {
      c.currentPrice = amount;
      appendMessage('other', c.seller.accept);
      c.completed = true;
    } else {
      c.patience--;
      if (c.patience < 0) {
        appendMessage('other', c.seller.angry);
        c.abandoned = true;
      } else {
        const counter = round100((amount + c.currentPrice) / 2);
        c.currentPrice = Math.max(counter, c.minPrice);
        appendMessage('other', c.seller.counter(c.currentPrice));
      }
    }
    updateChatUI();
  }, 500 + Math.random() * 400);
}

function playerAcceptSell(amount) {
  const c = chat;
  if (!c || c.completed || c.abandoned || c.pending || c.keyboardOpen) return;
  c.pending = true;
  const snapshot = c;
  appendMessage('me', `Продаю за ${fmt(amount)}`);
  c.currentPrice = amount;
  setTimeout(() => {
    if (chat !== snapshot) return;
    c.pending = false;
    appendMessage('other', c.buyer.accept);
    c.completed = true;
    updateChatUI();
  }, 400);
}

function playerCounterSell(amount) {
  const c = chat;
  if (!c || c.completed || c.abandoned || c.pending || c.keyboardOpen) return;
  amount = Math.round(amount);
  c.pending = true;
  const snapshot = c;
  appendMessage('me', `Хочу ${fmt(amount)}`);
  setTimeout(() => {
    if (chat !== snapshot) return;
    c.pending = false;
    if (amount <= c.maxPrice) {
      c.currentPrice = amount;
      appendMessage('other', c.buyer.accept);
      c.completed = true;
    } else {
      if (c.raises < c.maxRaises && amount <= c.maxPrice * c.buyer.raiseFactor) {
        c.raises++;
        c.currentPrice = round100(Math.min(c.maxPrice, amount * c.buyer.raiseFactor));
        appendMessage('other', c.buyer.counter(c.currentPrice));
      } else {
        appendMessage('other', c.buyer.angry);
        c.abandoned = true;
        S.rep = Math.max(0, S.rep - 3);
      }
    }
    updateChatUI();
  }, 500 + Math.random() * 400);
}

window.leaveChat = () => {
  if (!chat) { closeSheet(); return; }
  if (chat.type === 'sell' && !chat.completed) S.rep = Math.max(0, S.rep - 1);
  chat = null;
  closeSheet();
};
window.finalizeChat = () => {
  if (!chat || !chat.completed) return;
  if (chat.type === 'buy') completeBuyFromChat();
  else completeSellFromChat();
};

function completeBuyFromChat() {
  const c = chat;
  const it = c.item;
  const price = c.currentPrice;
  if (S.money < price) { toast('Недостаточно денег', 'error'); return; }
  if (S.inv.length >= invLimit()) { toast('Инвентарь полон', 'error'); return; }
  S.money -= price;
  S.stats.totalSpent += price;
  S.stats.itemsBought++;
  it.askPrice = price;
  S.market = S.market.filter(x => x.id !== it.id);
  S.inv.push(it);

  if (it.isBlack) {
    unlockAch('black_bought');
    if (Math.random() < it.scamChance) {
      setTimeout(() => {
        if (!S.inv.find(x => x.id === it.id)) return;
        S.inv = S.inv.filter(x => x.id !== it.id);
        S.rep = Math.max(0, S.rep - 15);
        playSound('error'); haptic(50);
        toast(`🚨 ${it.name} изъят! −15 репутации`, 'error');
        render();
      }, 1200);
    }
  }
  if (it.story && it.story.risk && Math.random() < it.story.risk) {
    setTimeout(() => {
      if (!S.inv.find(x => x.id === it.id)) return;
      S.inv = S.inv.filter(x => x.id !== it.id);
      S.rep = Math.max(0, S.rep - 10);
      playSound('error'); haptic(50);
      toast(`🚔 Изъято! −10 репутации`, 'error');
      render();
    }, 1500);
  }

  if (!it.inspected && it.defect) {
    it.inspected = true;
    S.stats.defectsFound++;
    S.stats.cleanStreak = 0;
    toast(`⚠️ Обнаружен дефект!`, 'error');
  } else if (!it.defect) {
    S.stats.cleanStreak++;
    checkAch();
  }

  playSound('buy'); haptic(20);
  toast(`Куплено за ${fmt(price)}`, 'success');
  track('buy', { price, item: it.name });
  chat = null;
  if (S.onboardingStep === 2) S.onboardingStep = 3;
  closeSheet();
}

function completeSellFromChat() {
  const c = chat;
  const it = c.item;
  const price = c.currentPrice;
  if (c.buyer.isScammer && Math.random() < 0.25) {
    const scamItemId = it.id;
    chat = null;
    closeSheet(true);
    showSheet(`
      <div class="drag-handle"></div>
      <h2>😈 Мошенник!</h2>
      <div class="msg"><div class="msg-avatar">😈</div><div class="msg-bubble">Протягивает фальшивые купюры.</div></div>
      <button class="btn-danger btn-full" onclick="scamRefuse()">Отказать (сохранить товар)</button>
      <button class="btn-ghost btn-full" onclick="scamAccept('${scamItemId}')">Всё равно взять</button>
    `);
    return;
  }
  const profit = price - it.askPrice;
  S.money += price;
  S.stats.totalEarned += price;
  S.stats.deals++;
  if (profit > S.stats.bestDeal) S.stats.bestDeal = profit;
  S.inv = S.inv.filter(x => x.id !== it.id);
  let repGain = 3;
  if (profit > it.askPrice * 0.3) repGain = 5;
  if (profit < 0) repGain = 1;
  S.rep = Math.min(100, S.rep + repGain);
  chat = null;
  playSound('sell'); haptic(20);
  toast(`${profit >= 0 ? '📈' : '📉'} ${profit >= 0 ? '+' : ''}${fmt(profit)}`, profit >= 0 ? 'success' : 'error');
  track('sell', { price, profit });
  checkAch();
  checkRich();
  if (S.onboardingStep === 3) S.onboardingStep = 4;
  closeSheet();
}

window.scamRefuse = () => {
  S.rep = Math.min(100, S.rep + 2);
  toast('Товар сохранён', 'success');
  closeSheet();
};
window.scamAccept = (itemId) => {
  const it = S.inv.find(x => x.id === itemId);
  if (it) {
    S.inv = S.inv.filter(x => x.id !== itemId);
    S.rep = Math.max(0, S.rep - 20);
    toast('😈 Обманули! −20 репутации', 'error');
  }
  closeSheet();
};

/* =========================================================
   REPAIR
   ========================================================= */
function repairItem(id) {
  const it = S.inv.find(x => x.id === id);
  if (!it || !it.defect) return;
  const masterCost = round100(it.marketValue * 0.2);
  showSheet(`
    <div class="drag-handle"></div>
    <h2>🔧 Ремонт ${it.emoji} ${it.name}</h2>
    <div class="hint">Играй сам и экономь, или заплати мастеру</div>

      <div class="card-top"><div class="emoji-box" style="background:var(--yellow-soft)">🎮</div>
        <div class="info"><div class="name">Самому (мини-игра)</div><div class="cond">3 раунда · попади в зону</div></div></div>
      <button class="btn-primary btn-full" onclick="startRepairGame(${id})">🔧 Играть</button>
    </div>

window.repairByMaster = (id) => {
  const it = S.inv.find(x => x.id === id);
  if (!it || !it.defect) return;
  const cost = round100(it.marketValue * 0.2);
  if (S.money < cost) return;
  S.money -= cost;
  S.stats.totalSpent += cost;
  it.defect = false; it.trueValue = it.marketValue; it.inspected = true;
  playSound('buy'); haptic(20);

};

const MG_ROUNDS = [
  { goodMin: 15, goodMax: 85, perfMin: 30, perfMax: 70, speed: 0.30 },
  { goodMin: 20, goodMax: 80, perfMin: 35, perfMax: 65, speed: 0.45 },
  { goodMin: 25, goodMax: 75, perfMin: 40, perfMax: 60, speed: 0.60 },
];
function startRepairGame(itemId) {
  const it = S.inv.find(x => x.id === itemId);
  if (!it) return;
  if (repairGame) cancelAnimationFrame(repairGame.rafId);
  repairGame = {
    itemId, item: it,
    round: 0, totalRounds: 3, score: 0, perfect: 0,
    results: [], speed: 0.30, position: 50, direction: 1,
    goodMin: 15, goodMax: 85, perfMin: 30, perfMax: 70,
    running: false, rafId: null, lastResult: null,
  };
  setupRound();
  renderRepairGame();
  startRepairLoop();
}
function setupRound() {
  const g = repairGame;
  if (!g) return;
  Object.assign(g, { ...MG_ROUNDS[g.round], position: 50, direction: 1, running: true, lastResult: null });
}
function startRepairLoop() {
  const g = repairGame;
  if (!g) return;
  const step = () => {
    if (!g || !g.running) return;
    g.position += g.speed * g.direction;
    if (g.position >= 100) { g.position = 100; g.direction = -1; }
    else if (g.position <= 0) { g.position = 0; g.direction = 1; }
    const cursor = document.getElementById('mgCursor');
    if (cursor) cursor.style.left = g.position + '%';
    g.rafId = requestAnimationFrame(step);
  };
  g.rafId = requestAnimationFrame(step);
}
function renderRepairGame() {
  const g = repairGame;
  if (!g) return;
  const dots = [];
  for (let i = 0; i < g.totalRounds; i++) {
    const cls = g.results[i] || (i === g.round ? 'current' : '');
    dots.push(`<div class="mg-dot ${cls}"></div>`);
  }
  let resultHtml = '<div class="mg-result empty">Нажми СТОП в цветной зоне</div>';
  if (g.lastResult === 'perfect') resultHtml = '<div class="mg-result perfect">⭐ Идеально! +2</div>';
  else if (g.lastResult === 'good') resultHtml = '<div class="mg-result good">✓ Попал! +1</div>';
  else if (g.lastResult === 'miss') resultHtml = '<div class="mg-result miss">✗ Мимо!</div>';
  showSheet(`
    <div class="drag-handle"></div>
    <div class="mg-title">🔧 Ремонт</div>
    <div class="mg-round">Раунд ${g.round + 1} / ${g.totalRounds} · Очки: ${g.score}</div>
    <div class="mg-dots">${dots.join('')}</div>
    <div class="mg-bar">
      <div class="mg-zone-good" style="left:${g.goodMin}%;width:${g.goodMax - g.goodMin}%"></div>
      <div class="mg-zone-perfect" style="left:${g.perfMin}%;width:${g.perfMax - g.perfMin}%"></div>
      <div class="mg-cursor" id="mgCursor" style="left:${g.position}%"></div>
    </div>
    ${resultHtml}
    <button class="btn-primary btn-full" style="padding:18px;font-size:17px" onclick="stopRepair()">🛑 СТОП</button>
    <button class="btn-ghost btn-full" onclick="abortRepair()">Выйти</button>
  `);
}
window.stopRepair = () => {
  const g = repairGame;
  if (!g || !g.running) return;
  g.running = false;
  cancelAnimationFrame(g.rafId);
  let result;
  if (g.position >= g.perfMin && g.position <= g.perfMax) {
    g.score += 2; g.perfect++; result = 'perfect'; playSound('perfect'); haptic(25);
  } else if (g.position >= g.goodMin && g.position <= g.goodMax) {
    g.score += 1; result = 'good'; playSound('good'); haptic(15);
  } else {
    result = 'miss'; playSound('error'); haptic(30);
  }
  g.lastResult = result;
  g.results[g.round] = result === 'perfect' ? 'perfect' : result === 'good' ? 'hit' : 'miss';
  g.round++;
  if (g.round >= g.totalRounds) {
    renderRepairGame();
    setTimeout(finishRepairGame, 900);
  } else {
    renderRepairGame();
    setTimeout(() => {
      if (!repairGame) return;
      setupRound(); renderRepairGame(); startRepairLoop();
    }, 900);
  }
};
window.abortRepair = () => {
  if (repairGame) cancelAnimationFrame(repairGame.rafId);
  repairGame = null;
  closeSheet();
};
function finishRepairGame() {
  const g = repairGame;
  if (!g) return;
  cancelAnimationFrame(g.rafId);
  const it = g.item;
  const masterCost = round100(it.marketValue * 0.2);
  let payCost = 0, fixed = false, summaryText = '', emoji = '';
  if (g.score >= 4) { payCost = 0; fixed = true; emoji = '🏆'; summaryText = 'Идеальный ремонт! Бесплатно'; }
  else if (g.score >= 2) { payCost = round100(masterCost * 0.2); fixed = true; emoji = '✅'; summaryText = 'Хорошо починил!'; }
  else if (g.score >= 1) { payCost = round100(masterCost * 0.5); fixed = true; emoji = '🔧'; summaryText = 'Починил, но не идеально'; }
  else { fixed = false; emoji = '💀'; summaryText = 'Провал! Стало хуже'; }
  if (S.money < payCost) payCost = Math.max(0, S.money);
  showSheet(`
    <div class="drag-handle"></div>
    <div class="mg-summary">
      <div class="big">${emoji}</div>
      <div class="txt">${summaryText}</div>
      <div class="sub">Очки: ${g.score}/6 · ${g.perfect} perfect</div>
      <div class="rows" style="text-align:left;background:var(--surface-2);padding:12px;border-radius:12px">
        ${payCost > 0 ? `<div class="row"><span>Заплатить</span><b>${fmt(payCost)}</b></div>` : ''}
        <div class="row"><span>Результат</span><b class="${fixed ? 'good' : 'bad'}">${fixed ? '✓ Починен' : '✗ Сломан'}</b></div>
      </div>
    </div>
    <button class="btn-primary btn-full" onclick="confirmRepairResult(${fixed}, ${payCost})">Готово</button>
  `);
}
window.confirmRepairResult = (fixed, payCost) => {
  const g = repairGame;
  if (!g) { closeSheet(); return; }
  const it = g.item;
  S.money -= payCost;
  S.stats.totalSpent += payCost;
  if (fixed) {
    it.defect = false; it.trueValue = it.marketValue; it.inspected = true;
    S.stats.repairsDone++;
    playSound('sell');
    if (g.score >= 4) unlockAch('first_repair');
    if (g.score === 6) unlockAch('perfect_repair');
    track('repair', { score: g.score });
  } else {
    it.trueValue = round100(it.trueValue * 0.85);
    playSound('error');
  }
  repairGame = null;
  closeSheet();
};

/* =========================================================
   ORDERS / UPGRADES / MISC
   ========================================================= */
function completeOrder(orderId) {
  const o = S.orders.find(x => x.id === orderId);
  if (!o || o.done || o.failed) return;
  const it = S.inv.find(i => i.name === o.name && !i.defect);
  if (!it) return;
  S.inv = S.inv.filter(x => x.id !== it.id);
  S.money += o.reward;
  S.stats.totalEarned += o.reward;
  S.stats.deals++;
  S.stats.ordersDone++;
  S.rep = Math.min(100, S.rep + 8);
  o.done = true;
  const profit = o.reward - it.askPrice;
  if (profit > S.stats.bestDeal) S.stats.bestDeal = profit;
  toast(`✅ Заказ! +${fmt(profit)}`, 'success');
  playSound('sell'); haptic(30);
  track('order_done', { profit });
  checkAch(); checkRich(); render();
}
function buyUpgrade(id) {
  const u = UPGRADES[id];
  if (u.levels) {
    const lvl = S.up[id];
    if (lvl >= u.levels.length) return;
    const next = u.levels[lvl];
    if (S.money < next.cost) return;
    S.money -= next.cost; S.stats.totalSpent += next.cost;
    S.up[id] = lvl + 1;
    if (id === 'market') newMarket();
  } else {
    if (S.up[id] || S.money < u.cost) return;
    S.money -= u.cost; S.stats.totalSpent += u.cost;
    S.up[id] = true;
  }
  toast(`✓ ${u.name}`, 'success');
  playSound('buy'); haptic(20);
  track('upgrade', { id });
  render();
}
function buyTransport(level) {
  const t = TRANSPORTS[level];
  if (!t || S.transport !== level - 1) return;
  if (bizLevel() < t.reqLevel || S.money < t.cost) return;
  S.money -= t.cost; S.stats.totalSpent += t.cost;
  S.transport = level;
  toast(`🚗 ${t.name}`, 'success');
  playSound('buy'); haptic(30);
  render();
}
function buySkill(branch) {
  if (S.skillPoints <= 0 || S.skills[branch] >= 3) return;
  S.skills[branch]++;
  S.skillPoints--;
  toast(`⭐ ${SKILLS[branch].name} ур. ${S.skills[branch]}`, 'success');
  playSound('ach'); haptic(20);
  render();
}
function buyPallet() {
  if (!S.pallet || S.transport < 3) return;
  const p = S.pallet;
  if (S.money < p.price || S.inv.length + p.size > invLimit()) return;
  S.money -= p.price; S.stats.totalSpent += p.price;
  const items = [];
  for (let i = 0; i < p.size; i++) {
    const it = makeLot();
    S.inv.push(it); items.push(it);
  }
  S.pallet = null;
  unlockAch('pallet_first');
  showSheet(`
    <div class="drag-handle"></div>
    <h2>📦 Палета распакована!</h2>
    <div class="rows">${items.map(it => `<div class="row"><span>${it.emoji} ${it.name}</span><b>${fmt(it.marketValue)}</b></div>`).join('')}</div>
    <button class="btn-primary btn-full" onclick="closeSheet()">Отлично</button>
  `);
  playSound('buy'); haptic(40);
  render();
}
function storeItem(id) {
  const it = S.inv.find(x => x.id === id);
  if (!it || S.storage.length >= storageLimit()) return;
  S.inv = S.inv.filter(x => x.id !== id);
  it.storedDay = S.day;
  S.storage.push(it);
  render();
}
function unstoreItem(id) {
  const it = S.storage.find(x => x.id === id);
  if (!it || S.inv.length >= invLimit()) return;
  S.storage = S.storage.filter(x => x.id !== id);
  delete it.storedDay;
  S.inv.push(it);
  render();
}
function takeCredit() {
  const limit = creditLimit();
  if (S.credit >= limit) { toast('Лимит достигнут', 'error'); return; }
  const avail = limit - S.credit;
  showSheet(`
    <div class="drag-handle"></div>
    <h2>💳 Взять кредит</h2>
    <div class="hint">Доступно: ${fmt(avail)}. Ставка 10% в день.</div>
    <input id="creditInput" type="number" placeholder="Сумма" inputmode="numeric" value="${Math.min(avail, 5000)}" style="padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-family:inherit;font-size:16px;font-weight:600;text-align:center;width:100%">
    <button class="btn-primary btn-full" onclick="confirmCredit()">Взять</button>
    <button class="btn-ghost btn-full" onclick="closeSheet()">Отмена</button>
  `);
}
window.confirmCredit = () => {
  const inp = el('creditInput');
  if (!inp) return;
  const limit = creditLimit();
  const avail = limit - S.credit;
  const n = Math.max(0, Math.min(avail, Math.round(Number(inp.value || 0) / 100) * 100));
  if (!n) { toast('Введите сумму', 'error'); return; }
  S.credit += n; S.money += n;
  toast(`💳 +${fmt(n)}`, 'success');
  track('credit_take', { amount: n });
  closeSheet();
};
function payCredit() {
  if (S.credit <= 0 || S.money < S.credit) { toast('Недостаточно средств', 'error'); return; }
  showConfirm(`Погасить ${fmt(S.credit)}?`, 'Кредит будет полностью закрыт.', () => {
    S.money -= S.credit; S.stats.totalSpent += S.credit;
    S.credit = 0;
    toast('💳 Кредит закрыт', 'success');
    render();
  });
}

function checkDailyBonus() {
  const today = new Date().toDateString();
  if (S.lastBonusDate === today) return;
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  S.dailyStreak = (S.lastBonusDate === yesterday) ? S.dailyStreak + 1 : 1;
  const bonus = Math.min(500 + (S.dailyStreak - 1) * 500, 5000);
  S.money += bonus;
  S.lastBonusDate = today;
  const b = document.createElement('div');
  b.className = 'bonus-toast';
  b.innerHTML = `🎁 Бонус за вход<br><div class="amt">+${fmt(bonus)}</div>День ${S.dailyStreak} подряд`;
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 2500);
  haptic(50);
  track('daily_bonus', { streak: S.dailyStreak });
}

function nextDay() {
  if (chat || repairGame) return;
  S.day++;
  const rent = rentCost();
  if (S.money < rent) {
    S.rep = Math.max(0, S.rep - 10);
    toast(`⚠️ Аренда — не хватает! −10 репутации`, 'error');
  }
  S.money -= rent;
  if (S.credit > 0) S.credit += creditInterest();
  S.event = null;
  if (Math.random() < 0.35) {
    S.event = pick([
      { id: 'tech_boom', emoji: '📈', text: 'Техника в цене! +20%', effect: 'sellBoost', cat: 'tech', mult: 1.20 },
      { id: 'vintage', emoji: '🎷', text: 'Мода на винтаж +25%', effect: 'sellBoost', cat: 'hobby', mult: 1.25 },
      { id: 'sport', emoji: '🌞', text: 'Спорт в топе +20%', effect: 'sellBoost', cat: 'sport', mult: 1.20 },
      { id: 'inspect', emoji: '🔍', text: 'Осмотр бесплатный', effect: 'freeInspect' },
      { id: 'crash', emoji: '📉', text: 'Рынок просел −20%', effect: 'cheapMarket', mult: 0.80 },
      { id: 'frenzy', emoji: '🔥', text: 'Ажиотаж +15%', effect: 'sellBoostAll', mult: 1.15 },
      { id: 'tax', emoji: '🧾', text: 'Налоговая +800₽', effect: 'taxRaise', amount: 800 },
    ]);
  }
  newMarket();
  S.orders.forEach(o => {
    if (!o.done && !o.failed && S.day > o.deadline) {
      o.failed = true;
      S.rep = Math.max(0, S.rep - 5);
    }
  });
  if (Math.random() < 0.55) makeOrder();
  if (Math.random() < 0.2) makeOrder();
  if (S.transport >= 3 && (!S.pallet || S.day - S.pallet.day >= 3)) {
    if (Math.random() < 0.6) makePallet();
  }
  playSound('click'); haptic(10);
  track('day', { day: S.day });
  render();
}

function checkRich() {
  if (S.money >= TARGET_MONEY && !S.wasRich) {
    S.wasRich = true;
    track('goal_reached', { day: S.day });
    setTimeout(() => {
      showAlert('Цель достигнута!', `Баланс: ${fmt(S.money)}<br>Дней: ${S.day}<br>Сделок: ${S.stats.deals}<br><br>Следующая цель — 2 000 000₽ (Империя)!`, '🏆');
    }, 400);
  }
}

/* =========================================================
   EVENT HANDLERS
   ========================================================= */
el('modal').addEventListener('click', e => {
  if (e.target === el('modal') && !chat && !repairGame && !confirmCallback) closeSheet();
});
el('appMain').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const id = btn.dataset.id;
  const act = btn.dataset.act;
  if (act === 'inspect') inspectLot(+id);
  else if (act === 'buy') startBuyChat(+id);
  else if (act === 'repair') repairItem(+id);
  else if (act === 'store') storeItem(+id);
  else if (act === 'unstore') unstoreItem(+id);
  else if (act === 'sell') startSellChat(+id);
  else if (act === 'order') completeOrder(+id);
  else if (act === 'upgrade') buyUpgrade(id);
  else if (act === 'transport') buyTransport(+id);
  else if (act === 'skill') buySkill(id);
  else if (act === 'pallet') buyPallet();
  else if (act === 'payCredit') payCredit();
  else if (act === 'takeCredit') takeCredit();
  else if (act === 'sound') { S.soundOn = !S.soundOn; playSound('click'); render(); }
  else if (act === 'haptic') { S.hapticOn = !S.hapticOn; haptic(30); render(); }
  else if (act === 'reset') resetGame();
});
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});
function switchTab(tab) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  activeTab = tab;
  el('appMain').scrollTop = 0;
  playSound('click'); haptic(10);
  render();
}
let touchStart = null;
el('appMain').addEventListener('touchstart', e => {
  if (e.touches.length === 1) touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
el('appMain').addEventListener('touchend', e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  touchStart = null;
  if (Math.abs(dx) > 60 && Math.abs(dy) < 40) {
    const tabs = ['market', 'inv', 'orders', 'biz', 'profile'];
    let i = tabs.indexOf(activeTab);
    if (dx < 0) i = Math.min(tabs.length - 1, i + 1);
    else i = Math.max(0, i - 1);
    if (i !== tabs.indexOf(activeTab)) switchTab(tabs[i]);
  }
}, { passive: true });

/* =========================================================
   START
   ========================================================= */
window.startGame = () => {
  el('splash').classList.add('hidden');
  gameStarted = true;
  track('game_start');
  if (!S.market.length) newMarket();
  render();
  checkDailyBonus();
  render();
};

function init() {
  const loaded = load();
  document.documentElement.setAttribute('data-theme', S.theme);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = S.theme === 'dark' ? '#0a0e14' : '#f5f6f8';
  if (!loaded) {
    newMarket();
    makeOrder();
  }
  if (!S.market.length) newMarket();
  if (!loaded && !S.firstPlayed) {
    el('splashLoading').textContent = SafeStorage.available ? '' : '⚠️ Сохранение недоступно в этом режиме';
    S.firstPlayed = true;
  } else {
    el('splash').classList.add('hidden');
    gameStarted = true;
    render();
    checkDailyBonus();
    render();
    setTimeout(() => toast('💾 Прогресс загружен', 'success'), 300);
  }
  saveDebounced();
}
init();
</script>
