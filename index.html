function createOrder(ad, side, rubAmt, method, merchantOverride) {
  const usdtAmt = +(rubAmt / ad.price).toFixed(6);
  const merchant = merchantOverride || ad.merchant;
  if (side === 'sell') {
    if (usdtAmt > state.usdt + 1e-9) { toast('Недостаточно USDT', 'err'); return; }
    state.usdt -= usdtAmt;
  } else {
    if (rubAmt > state.rub) { toast('Недостаточно RUB', 'err'); return; }
  }
  const order = {
    id: 'ORD-' + (ORDER_ID++), side, price: ad.price,
    usdt: usdtAmt, rub: rubAmt, method, merchant,
    status: side === 'buy' ? 'pay' : 'merchant_pay',
    createdAt: Date.now(), deadline: Date.now() + ORDER_TTL, messages: [], unread: 0,
  };
  state.totalCreated++;
  sysMsg(order, `Сделка ${order.id} создана. ${side === 'buy' ? `USDT продавца (${usdF(usdtAmt)}) заблокированы в эскроу.` : `Ваши ${usdF(usdtAmt)} заблокированы в эскроу.`}`);
  pushMsg(order, 'them', 'Привет! Я на связи, готов к сделке 👋');
  if (side === 'buy') sysMsg(order, `Шаг 1: переведите ${rubF(rubAmt)} через «${method}» на реквизиты продавца. Шаг 2: нажмите «Я оплатил». На оплату — 15 минут.`);
  else sysMsg(order, `Ожидайте оплаты от покупателя. После поступления денег нажмите «Подтвердить получение» — USDT уйдут покупателю.`);
  state.orders.unshift(order);
  state.openOrderId = order.id;
  ad.amount = +(ad.amount - usdtAmt).toFixed(6);
  notify(`Создана сделка ${order.id}`, order.id);
  renderAll();
  renderOrderModal();
  toast('Сделка создана: ' + order.id, 'ok');
  beep(520, 0.15, 0.06);
  if (side === 'sell') scheduleBuyerPayment(order);
}

function simulateSMS(bank, amount) {
  if (!state.smsSim) return;
  const el = document.createElement('div');
  el.className = 'toast sms';
  el.innerHTML = `📱 <b>${bank}</b> · Зачисление ${rubF(amount)}`;
  $('#toasts').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0'; el.style.transform = 'translateY(12px)';
    setTimeout(() => el.remove(), 320);
  }, 3500);
}

function scheduleBuyerPayment(order) {
  if (order.merchant.fraudType === 'cancel_request' && Math.random() < 0.5) {
    setTimeout(() => {
      if (order.status !== 'merchant_pay') return;
      pushMsg(order, 'them', 'Слушайте, у меня не проходит платёж. Отмените сделку, я попробую ещё раз');
      sysMsg(order, '⚠️ Покупатель просит отменить сделку. Это может быть попыткой уйти от оплаты. Не отменяйте без веской причины.');
      refreshOrderUI(order);
    }, rnd(8000, 15000));
    return;
  }
  if (order.merchant.fraudType === 'fake_sms' && Math.random() < 0.5) {
    setTimeout(() => {
      if (order.status !== 'merchant_pay') return;
      pushMsg(order, 'them', '✅ Перевод выполнен. Скриншот: /payments/receipt.png');
      sysMsg(order, '⚠️ Покупатель прислал «скриншот» — это не подтверждение. Проверьте реальное поступление на счёт.');
      refreshOrderUI(order);
    }, rnd(5000, 10000));
    return;
  }
  setTimeout(() => {
    if (order.status !== 'merchant_pay') return;
    if (!setOrderStatus(order, 'confirm')) return;
    order.releaseAt = Date.now();
    pushMsg(order, 'them', `Оплатил ${rubF(order.rub)} по ${order.method}. Проверьте поступление и подтвердите.`);
    sysMsg(order, 'Покупатель отметил оплату. Проверьте счёт и нажмите «Подтвердить получение».');
    simulateSMS(pick(BANKS_SMS), order.rub);
    notify(`Покупатель оплатил сделку ${order.id}`, order.id);
    refreshOrderUI(order);
    toast('Покупатель оплатил ' + order.id, 'ok');
  }, rnd(3500, 7000));
}

function afterUserPaid(order) {
  if (order.merchant.isBad) {
    if (order.merchant.fraudType === 'wrong_req' && Math.random() < 0.7) {
      setTimeout(() => {
        if (order.status !== 'release') return;
        pushMsg(order, 'them', 'Извините, у меня карта заблокирована. Оплатите на другой счёт: 4276 **** **** 8899');
        sysMsg(order, '⚠️ ОПАСНО: смена реквизитов после оплаты — типичная схема мошенничества. НЕ отправляйте повторно. Открывайте спор.');
        refreshOrderUI(order);
      }, rnd(3000, 6000));
    } else if (order.merchant.fraudType === 'cancel_request' || Math.random() < 0.5) {
      setTimeout(() => {
        if (order.status !== 'release') return;
        pushMsg(order, 'them', 'Извините, я ошибся с суммой. Отмените сделку, я переведу заново');
        sysMsg(order, '⚠️ Внимание: просьба отменить сделку после оплаты — типичная схема мошенничества. НЕ отменяйте, открывайте спор.');
        refreshOrderUI(order);
      }, rnd(3000, 6000));
    } else {
      setTimeout(() => {
        if (order.status !== 'release') return;
        sysMsg(order, '⚠️ Продавец долго не отвечает. Если он не подтвердит — откройте спор.');
        refreshOrderUI(order);
      }, 60000);
    }
  } else {
    setTimeout(() => {
      if (order.status !== 'release') return;
      pushMsg(order, 'them', 'Вижу оплату, проверяю поступление...');
      refreshOrderUI(order);
    }, rnd(1200, 2200));
    setTimeout(() => {
      if (order.status !== 'release') return;
      completeOrder(order, 'Спасибо за сделку! ✅');
      toast(`+${usdF(order.usdt)} зачислено`, 'ok');
    }, rnd(3800, 6200));
  }
}

function orderAction(id, op) {
  const order = state.orders.find(o => o.id === id);
  if (!order) return;
  if (op === 'pay') {
    if (order.status !== 'pay') return;
    if (order.rub > state.rub) return toast('Недостаточно RUB', 'err');
    state.rub -= order.rub;
    if (!setOrderStatus(order, 'release')) return;
    order.releaseAt = Date.now();
    pushMsg(order, 'me', `Оплатил ${rubF(order.rub)} через ${order.method}.`);
    sysMsg(order, 'Вы отметили оплату. Ожидайте подтверждения продавца. Если он не подтвердит — откройте спор.');
    refreshOrderUI(order);
    toast('Оплата отмечена. Ждём подтверждения.', 'ok');
    beep(660, 0.12, 0.06);
    afterUserPaid(order);
  }
  if (op === 'confirm') {
    if (order.status !== 'confirm') return;
    askConfirm({ title: 'Подтвердить получение', message: `Подтвердить получение ${rubF(order.rub)}? USDT (${usdF(order.usdt)}) будут отправлены покупателю.`, yesLabel: 'Подтвердить' })
      .then(ok => {
        if (!ok) return;
        state.rub += order.rub;
        pushMsg(order, 'me', 'Деньги получил, USDT отпущены.');
        completeOrder(order, 'Спасибо, отличная сделка! 👍');
        toast(`+${rubF(order.rub)} зачислено`, 'ok');
      });
  }
  if (op === 'cancel') {
    if (order.status !== 'pay' && order.status !== 'merchant_pay') return;
    askConfirm({ title: 'Отменить сделку', message: 'Средства вернутся из эскроу на баланс. Продолжить?', yesLabel: 'Отменить', noLabel: 'Оставить', danger: true })
      .then(ok => {
        if (!ok) return;
        if (!setOrderStatus(order, 'cancelled')) return;
        state.totalCancelled++;
        if (order.side === 'sell') state.usdt += order.usdt;
        sysMsg(order, 'Сделка отменена. Средства возвращены из эскроу.');
        notify(`Сделка ${order.id} отменена`, order.id);
        refreshOrderUI(order);
        toast('Сделка отменена', 'err');
        beep(320, 0.15, 0.06);
      });
  }
  if (op === 'dispute') {
    if (!['release', 'confirm'].includes(order.status)) return;
    askConfirm({ title: 'Открыть спор', message: 'Средства останутся в эскроу до решения арбитра. Продолжить?', yesLabel: 'Открыть спор', danger: true })
      .then(ok => {
        if (!ok) return;
        if (!setOrderStatus(order, 'disputed')) return;
        pushMsg(order, 'me', 'Открываю спор — есть проблема со сделкой.');
        sysMsg(order, 'Спор открыт. Средства заморожены. Арбитр напишет в этот чат в течение 24 часов.');
        notify(`Открыт спор по сделке ${order.id}`, order.id);
        refreshOrderUI(order);
        toast('Спор открыт. Средства заморожены.', 'err');
        beep(300, 0.2, 0.07);
      });
  }
}

function completeOrder(order, lastMsg) {
  if (!setOrderStatus(order, 'completed')) return;
  order.completedAt = Date.now();
  if (order.side === 'buy') { state.usdt += order.usdt; state.buyHistory.push({ amount: order.usdt, price: order.price }); }
  if (lastMsg) pushMsg(order, 'them', lastMsg);
  sysMsg(order, order.side === 'buy' ? `Сделка завершена. ${usdF(order.usdt)} зачислены на баланс.` : `Сделка завершена. ${rubF(order.rub)} зачислены на баланс.`);
  state.stats.completed++;
  state.stats.volumeRub += order.rub;
  checkMissions();
  notify(`Сделка ${order.id} завершена`, order.id);
  refreshOrderUI(order);
  beep(880, 0.14, 0.07);
  if (!state.firstTradeCelebrated && state.stats.completed === 1) { state.firstTradeCelebrated = true; fireConfetti(); save(); }
}

function fireConfetti() {
  const colors = ['#10e88a', '#ffd23f', '#5b9dff', '#ff4d6d', '#9b6dff', '#ffffff'];
  for (let i = 0; i < 80; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.background = pick(colors);
    el.style.left = rnd(0, 100) + 'vw';
    el.style.top = '-20px';
    el.style.borderRadius = Math.random() < 0.5 ? '50%' : '2px';
    el.style.animationDelay = rnd(0, 0.4) + 's';
    el.style.animationDuration = rnd(2, 3) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3200);
  }
}

/* ============ RENDER: ORDER MODAL ============ */
const STATUS_LABEL = {
  pay: 'Ожидает вашей оплаты', release: 'Ожидает подтверждения продавца',
  merchant_pay: 'Ожидает оплаты покупателя', confirm: 'Подтвердите получение денег',
  completed: 'Завершено', cancelled: 'Отменено', disputed: 'Спор открыт',
};
function stepsFor(order) { return order.side === 'buy' ? ['Ордер создан','Вы отправили оплату','USDT получены'] : ['Ордер создан','Покупатель оплатил','Вы подтвердили получение']; }
function doneCount(order) {
  if (order.status === 'completed') return 3;
  if (order.status === 'disputed') return 1;
  if (order.side === 'buy') { if (order.status === 'pay') return 1; if (order.status === 'release') return 2; }
  else { if (order.status === 'merchant_pay') return 1; if (order.status === 'confirm') return 2; }
  return order.status === 'cancelled' ? 0 : 1;
}

function renderOrderModal() {
  const order = state.orders.find(o => o.id === state.openOrderId);
  if (!order) return;
  if (order.unread) order.unread = 0;
  const steps = stepsFor(order);
  const done = doneCount(order);
  const activeIdx = order.status === 'completed' ? -1 : done;
  const isActive = ['pay', 'release', 'merchant_pay', 'confirm'].includes(order.status);
  const timeLeft = order.deadline - Date.now();
  const showTimer = isActive && ['pay', 'merchant_pay'].includes(order.status);
  const graceLeft = order.releaseAt ? (order.releaseAt + DISPUTE_GRACE - Date.now()) : 0;
  const canDispute = order.status === 'release' && graceLeft <= 0;

  const showReq = order.side === 'buy' && ['pay', 'release', 'disputed', 'completed'].includes(order.status);
  const reqHtml = showReq ? `<div class="req-block">
    <div class="req-head"><span>💳 Реквизиты для оплаты</span><button class="copy-btn" data-action="copy-req" data-order="${order.id}">Копировать</button></div>
    <div class="req-row"><span>Сумма к оплате</span><b>${rubF(order.rub)}</b></div>
    <div class="req-row"><span>Банк</span><b>${esc(order.method)}</b></div>
    <div class="req-row"><span>Номер карты</span><b>${order.merchant.req.card}</b></div>
    <div class="req-row"><span>Телефон (СБП)</span><b>${order.merchant.req.phone}</b></div>
    <div class="req-row"><span>Счёт получателя</span><b>${order.merchant.req.account}</b></div>
    <div style="font-size:11px;color:var(--muted);margin-top:8px">Получатель: ${esc(order.merchant.name)}</div>
  </div>` : '';

  let actions = '';
  if (order.status === 'pay') {
    actions = `<button class="btn green full" data-action="order-op" data-order="${order.id}" data-op="pay">Я оплатил ${rubF(order.rub)}</button>
      <button class="btn ghost full" style="margin-top:8px" data-action="order-op" data-order="${order.id}" data-op="cancel">Отменить сделку</button>`;
  } else if (order.status === 'confirm') {
    actions = `<button class="btn green full" data-action="order-op" data-order="${order.id}" data-op="confirm">Подтвердить получение ${rubF(order.rub)}</button>
      <button class="btn ghost full" style="margin-top:8px" data-action="order-op" data-order="${order.id}" data-op="dispute">Открыть спор</button>`;
  } else if (order.status === 'merchant_pay') {
    actions = `<button class="btn ghost full" data-action="order-op" data-order="${order.id}" data-op="cancel">Отменить сделку</button>`;
  } else if (order.status === 'release') {
    actions = canDispute ? `<button class="btn ghost full" data-action="order-op" data-order="${order.id}" data-op="dispute">Продавец не отвечает — открыть спор</button>` : `<div class="hint" style="text-align:center;padding:8px">Продавец подтверждает оплату… Спор будет доступен через ${fmtLeft(graceLeft)}</div>`;
  } else if (order.status === 'completed') {
    if (!order.reviewed) {
      const rated = order.reviewStars || 0;
      actions = `<div class="hint" style="text-align:center;margin-bottom:12px">Оцените сделку и оставьте отзыв</div>
        <div class="stars-input" id="reviewStars">${[1,2,3,4,5].map(i => `<span data-action="rate" data-v="${i}" class="${i <= rated ? 'on' : ''}">⭐</span>`).join('')}</div>
        <textarea id="reviewText" placeholder="Текст отзыва (необязательно)" style="min-height:60px;margin-bottom:10px;font-size:13px"></textarea>
        <button class="btn green full" data-action="submit-review" data-order="${order.id}">Отправить отзыв</button>
        <button class="btn ghost full" style="margin-top:8px" data-action="download-poster" data-order="${order.id}">📸 Скачать постер сделки</button>`;
    } else {
      actions = `<div class="hint" style="text-align:center;padding:8px;color:var(--green)">✓ Спасибо за отзыв!</div>
        <button class="btn ghost full" style="margin-top:8px" data-action="download-poster" data-order="${order.id}">📸 Скачать постер сделки</button>`;
    }
  } else if (order.status === 'disputed') {
    actions = `<div class="hint" style="text-align:center;padding:10px">Арбитр изучает обращение. Средства заморожены.</div>`;
  }

  const chatMsgs = order.messages.map(m => {
    if (m.from === 'system') return `<div class="msg system"><span class="help-ico">ℹ</span>${esc(m.text)}</div>`;
    return `<div class="msg ${m.from === 'me' ? 'me' : 'them'}">${esc(m.text)}<div style="font-size:9.5px;opacity:.6;margin-top:3px">${m.time}</div></div>`;
  }).join('');

  const timerHtml = showTimer ? `<div class="timer-bar ${timeLeft < 60000 ? 'urgent' : ''}" id="timerBar"><span class="lbl">⏱ Время на оплату</span><span class="time" id="timerText">${fmtLeft(timeLeft)}</span></div>` : '';

  $('#modalRoot').innerHTML = `<div class="backdrop" data-action="backdrop"><div class="modal wide">
    <div class="modal-head">
      <div><h3>Сделка ${order.id}</h3>
        <div style="font-size:11.5px;color:var(--muted);margin-top:3px">${order.side === 'buy' ? 'Покупка' : 'Продажа'} USDT · ${n2(order.price)} ₽ · ${esc(order.method)}</div>
      </div>
      <button class="x" data-action="close">✕</button>
    </div>
    ${timerHtml}
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap">
      <span class="status ${order.status}">${STATUS_LABEL[order.status]}</span>
      <div style="text-align:right"><div style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.3px">${usdF(order.usdt)}</div><div style="font-size:12px;color:var(--muted)">${rubF(order.rub)}</div></div>
    </div>
    <div class="steps">${steps.map((s, i) => {
      const cls = i < done ? 'done' : (i === activeIdx ? 'active' : '');
      return `<div class="step ${cls}"><div class="dot">${i < done ? '✓' : i + 1}</div><div class="txt">${s}</div></div>`;
    }).join('')}</div>
    <div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:16px">
      <div class="ava" data-action="open-merchant" data-merchant="${esc(order.merchant.name)}">${esc(order.merchant.name[0].toUpperCase())}${order.merchant.online ? '<span class="online"></span>' : ''}</div>
      <div><div class="ad-name" data-action="open-merchant" data-merchant="${esc(order.merchant.name)}" style="font-weight:600;font-size:13.5px">${esc(order.merchant.name)}</div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:2px">${order.side === 'buy' ? 'Продавец' : 'Покупатель'} · ${order.merchant.rating.toFixed(1)}★</div></div>
    </div>
    ${reqHtml}
    ${actions}
    <div class="chat" style="margin-top:18px">
      <div class="chat-log" id="chatLog">${chatMsgs}</div>
      <div class="quick-replies">
        <button class="qr" data-action="order-help">❓ Помощь</button>
        <button class="qr" data-action="qr" data-text="Оплатил ✅">Оплатил ✅</button>
        <button class="qr" data-action="qr" data-text="Проверяю поступление">Проверяю</button>
        <button class="qr" data-action="qr" data-text="Готов к сделке">Готов</button>
        <button class="qr" data-action="qr" data-text="Спасибо за сделку!">Спасибо</button>
      </div>
      <div class="chat-input"><input id="chatMsg" placeholder="Написать сообщение..." maxlength="140"><button data-action="send-msg" data-order="${order.id}">➤</button></div>
    </div>
  </div></div>`;
  const log = $('#chatLog'); log.scrollTop = log.scrollHeight;
  $('#chatMsg').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(order.id); });
}

function orderHelp(order) {
  const hints = {
    pay: `Как оплатить: 1) переведите ${rubF(order.rub)} через «${order.method}» на реквизиты выше; 2) нажмите «Я оплатил»; 3) дождитесь подтверждения.`,
    merchant_pay: 'Покупатель ещё не оплатил. Не отправляйте USDT до подтверждения поступления денег.',
    release: 'Вы отметили оплату. Продавец проверяет поступление. Если он не подтверждает более 3 минут — откройте спор.',
    confirm: 'Покупатель говорит, что оплатил. Проверьте счёт и нажмите «Подтвердить получение».',
    completed: 'Сделка завершена. Оставьте отзыв — это влияет на рейтинг мерчанта.',
    cancelled: 'Сделка отменена, средства возвращены из эскроу.',
    disputed: 'Спор открыт. Средства заморожены. Арбитр напишет в этот чат в течение 24 часов.',
  };
  const t = hints[order.status];
  if (t) sysMsg(order, t);
  refreshOrderUI(order);
}

function sendChat(orderId, presetText) {
  const order = state.orders.find(o => o.id === orderId);
  if (!order) return;
  const input = $('#chatMsg');
  const text = presetText || (input ? input.value.trim() : '');
  if (!text) return;
  pushMsg(order, 'me', text);
  if (input) input.value = '';
  saveSoon();
  const log = $('#chatLog');
  if (log) {
    log.insertAdjacentHTML('beforeend', `<div class="msg me">${esc(text)}<div style="font-size:9.5px;opacity:.6;margin-top:3px">${nowTime()}</div></div>`);
    log.scrollTop = log.scrollHeight;
  }
  const replies = ['Хорошо, принял 👍', 'Да, всё в силе.', 'Сейчас проверю поступление.', 'Спасибо за оперативность!', 'Ок, жду подтверждения.', 'Всё верно, сумма совпадает.'];
  setTimeout(() => {
    const r = pick(replies);
    pushMsg(order, 'them', r);
    saveSoon();
    const l = $('#chatLog');
    if (l && state.openOrderId === orderId) {
      l.insertAdjacentHTML('beforeend', `<div class="msg them">${esc(r)}<div style="font-size:9.5px;opacity:.6;margin-top:3px">${nowTime()}</div></div>`);
      l.scrollTop = l.scrollHeight;
    }
    renderBadges();
    if (state.tab === 'orders') renderOrders();
  }, rnd(1200, 3000));
}

/* ============ POSTER ============ */
function downloadPoster(order) {
  const canvas = document.createElement('canvas');
  canvas.width = 800; canvas.height = 500;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 800, 500);
  grad.addColorStop(0, '#0d1a2e'); grad.addColorStop(1, '#1a0d2e');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 800, 500);
  ctx.strokeStyle = 'rgba(255,255,255,.03)'; ctx.lineWidth = 1;
  for (let i = 0; i < 800; i += 40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 500); ctx.stroke(); }
  for (let i = 0; i < 500; i += 40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(800, i); ctx.stroke(); }
  ctx.fillStyle = '#5b9dff'; ctx.font = 'bold 20px Inter, sans-serif'; ctx.fillText('P2P Sim', 40, 60);

/* ============ CSV ============ */
function exportCSV() {
  if (!state.orders.length) { toast('Нет сделок для экспорта', 'err'); return; }
  const rows = [['ID', 'Тип', 'Мерчант', 'USDT', 'Руб', 'Курс', 'Способ', 'Статус', 'Дата создания', 'Дата завершения']];
  state.orders.forEach(o => {
    rows.push([o.id, o.side === 'buy' ? 'Покупка' : 'Продажа', o.merchant.name, o.usdt, o.rub, o.price, o.method, STATUS_LABEL[o.status], new Date(o.createdAt).toLocaleString('ru-RU'), o.completedAt ? new Date(o.completedAt).toLocaleString('ru-RU') : '']);
  });
  const csv = '\uFEFF' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `p2p-orders-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`Экспортировано ${state.orders.length} сделок`, 'ok');
}

/* ============ TICK ============ */
function tick() {
  const now = Date.now();
  let changed = false;
  for (const order of state.orders) {
    if ((order.status === 'pay' || order.status === 'merchant_pay') && now > order.deadline) {
      if (!setOrderStatus(order, 'cancelled')) continue;
      state.totalCancelled++;
      if (order.side === 'sell') state.usdt += order.usdt;
      sysMsg(order, 'Время на оплату истекло. Сделка отменена автоматически.');
      changed = true;
    }
  }
  if (changed) { renderWallet(); renderBadges(); if (state.tab === 'orders') renderOrders(); if (state.openOrderId) renderOrderModal(); toast('Сделка отменена по таймауту', 'err'); saveSoon(); }
  const timerText = $('#timerText');
  if (timerText && state.openOrderId) {
    const order = state.orders.find(o => o.id === state.openOrderId);
    if (order && (order.status === 'pay' || order.status === 'merchant_pay')) {
      const left = order.deadline - now;
      timerText.textContent = fmtLeft(left);
      const bar = $('#timerBar');
      if (bar) bar.classList.toggle('urgent', left < 60000);
    }
  }
  if (state.openOrderId) {
    const order = state.orders.find(o => o.id === state.openOrderId);
    if (order && order.status === 'release' && order.releaseAt) {
      const gracePassed = now > order.releaseAt + DISPUTE_GRACE;
      const hasDisputeBtn = !!$('#modalRoot [data-op="dispute"]');
      if (gracePassed && !hasDisputeBtn) renderOrderModal();
    }
  }
  checkPriceAlerts();
  if (state.marketEvent && now - state.marketEvent.ts > 120000) {
    state.marketEvent = null;
    if (state.tab === 'buy' || state.tab === 'sell') renderMarket(state.tab);
  }
}

/* ============ INCOMING ============ */
function maybeIncomingOrder() {
  const active = state.myAds.filter(a => a.amount > 0.5 && Date.now() - (a.createdAt || 0) < 30 * 60 * 1000);
  if (!active.length) return;
  if (Math.random() > 0.55) return;
  const ad = pick(active);
  const maxRub = Math.min(ad.max, ad.amount * ad.price);
  if (maxRub < ad.min) return;
  const rubAmt = Math.round(rnd(ad.min, maxRub));
  const usdtAmt = rubAmt / ad.price;
  if (usdtAmt > ad.amount) return;
  const side = ad.type === 'sell' ? 'sell' : 'buy';
  if (side === 'sell' && usdtAmt > state.usdt) return;
  if (side === 'buy' && rubAmt > state.rub) return;
  ad.amount = +(ad.amount - usdtAmt).toFixed(6);
  if (side === 'sell') state.usdt -= usdtAmt;
  const order = {
    id: 'ORD-' + (ORDER_ID++), side, price: ad.price,
    usdt: +usdtAmt.toFixed(6), rub: rubAmt, method: pick(ad.methods), merchant: makeMerchant(pick(NAMES)),
    status: side === 'buy' ? 'pay' : 'merchant_pay',
    createdAt: Date.now(), deadline: Date.now() + ORDER_TTL, messages: [], unread: 0,
  };
  state.totalCreated++;
  sysMsg(order, 'По вашему объявлению создан новый ордер.');
  pushMsg(order, 'them', 'Здравствуйте! Хочу совершить сделку по вашему объявлению.');
  pushMsg(order, 'them', 'Подскажите реквизиты для оплаты?');
  state.orders.unshift(order);
  notify(`Новый ордер ${order.id}`, order.id);
  toast(`Новый ордер ${order.id}`, 'ok');
  beep(720, 0.14, 0.06);
  if (side === 'sell') scheduleBuyerPayment(order);
  saveSoon(); renderWallet(); renderBadges();
  if (state.tab === 'orders') renderOrders();
}

/* ============ RENDER ALL ============ */
function renderAll() {
  renderWallet();
  renderBadges();
  renderBell();
  renderSparkline();
  ['buy', 'sell', 'myads', 'orders', 'profile'].forEach(t => {
    const el = $('#view-' + t);
    if (el) el.style.display = (state.tab === t) ? '' : 'none';
  });
  if (state.tab === 'buy' || state.tab === 'sell') renderMarket(state.tab);
  if (state.tab === 'myads') renderMyAds();
  if (state.tab === 'orders') renderOrders();
  if (state.tab === 'profile') renderProfile();
  saveSoon();
}

/* ============ TOAST ============ */
function toast(text, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = text;
  $('#toasts').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .35s, transform .35s';
    el.style.opacity = '0'; el.style.transform = 'translateY(12px)';
    setTimeout(() => el.remove(), 350);
  }, 2800);
}

/* ============ THEME ============ */
function applyTheme(theme) {
  state.theme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  const btn = $('#themeBtn');
  if (btn) btn.textContent = theme === 'dark' ? '🌙' : '☀️';
  save();
}

/* ============ STREAK ============ */
function updateStreak() {
  const today = new Date().toDateString();
  const last = state.streak.lastVisit;
  if (last === today) return;
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  if (last === yesterday) state.streak.days = (state.streak.days || 0) + 1;
  else state.streak.days = 1;
  state.streak.lastVisit = today;
  save();
}

/* ============ ONBOARDING ============ */
let onboardIdx = 0;
function showOnboarding() { onboardIdx = 0; renderOnboard(); }
function renderOnboard() {
  const step = ONBOARD_STEPS[onboardIdx];
  const isLast = onboardIdx === ONBOARD_STEPS.length - 1;
  let root = $('#onboardRoot');
  if (!root) { root = document.createElement('div'); root.id = 'onboardRoot'; document.body.appendChild(root); }
  root.innerHTML = `<div class="onboard-overlay">
    <div class="onboard-card">
      <div class="onboard-icon">${step.icon}</div>
      <h3>${esc(step.title)}</h3>
      <p>${esc(step.text)}</p>
      <div class="onboard-dots">${ONBOARD_STEPS.map((_, i) => `<span class="${i === onboardIdx ? 'active' : ''}"></span>`).join('')}</div>
      <div class="onboard-actions">
        ${onboardIdx > 0 ? `<button class="btn ghost" style="flex:1" data-action="onboard-prev">Назад</button>` : ''}
        <button class="btn green" style="flex:1" data-action="onboard-next">${isLast ? 'Начать' : 'Далее'}</button>
      </div>
    </div>
  </div>`;
}
function closeOnboarding() { const root = $('#onboardRoot'); if (root) root.remove(); state.onboarded = true; save(); }

/* ============ RIPPLE DELEGATION ============ */
document.addEventListener('mousedown', e => {
  const btn = e.target.closest('.btn, .pinpad button, .qr');
  if (btn) addRipple({ currentTarget: btn, clientX: e.clientX, clientY: e.clientY });
});

/* ============ EVENTS ============ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'backdrop') { if (e.target === el) closeModal(); return; }
  if (a === 'close') { closeModal(); return; }
  if (a === 'close-event') { state.marketEvent = null; if (state.tab === 'buy' || state.tab === 'sell') renderMarket(state.tab); return; }
  if (a === 'open-trade') { const ad = state.ads.find(x => x.id === +el.dataset.ad); openTradeModal(ad); return; }
  if (a === 'open-order') { state.openOrderId = el.dataset.order; renderOrderModal(); if (state.tab === 'orders') renderOrders(); renderBadges(); return; }
  if (a === 'open-merchant') { openMerchantModal(el.dataset.merchant); return; }
  if (a === 'open-notifications') { openNotificationsModal(); return; }
  if (a === 'open-notification') {
    const n = state.notifications.find(x => x.id === +el.dataset.notif);
    if (n) { n.read = true; renderBell(); }
    if (el.dataset.order) { state.openOrderId = el.dataset.order; renderOrderModal(); }
    else openNotificationsModal();
    return;
  }
  if (a === 'read-all') { state.notifications.forEach(n => n.read = true); renderBell(); openNotificationsModal(); return; }
  if (a === 'toggle-fav') {
    toggleFav(el.dataset.name);
    if (el.dataset.closeAfter) { openMerchantModal(el.dataset.name); return; }
    if (state.tab === 'buy' || state.tab === 'sell') renderMarket(state.tab);
    return;
  }
  if (a === 'order-op') { orderAction(el.dataset.order, el.dataset.op); return; }
  if (a === 'order-help') { const order = state.orders.find(o => o.id === state.openOrderId); if (order) orderHelp(order); return; }
  if (a === 'send-msg') { sendChat(el.dataset.order); return; }
  if (a === 'qr') { sendChat(state.openOrderId, el.dataset.text); return; }
  if (a === 'copy-req') {
    const order = state.orders.find(o => o.id === el.dataset.order);
    if (!order) return;
    const text = `Сумма: ${rubF(order.rub)}\nБанк: ${order.method}\nКарта: ${order.merchant.req.card}\nТелефон: ${order.merchant.req.phone}\nСчёт: ${order.merchant.req.account}\nПолучатель: ${order.merchant.name}`;
    const cb = el;
    const doFeedback = () => {
      cb.classList.add('copied');
      cb.textContent = '✓ Скопировано';
      setTimeout(() => { cb.classList.remove('copied'); cb.textContent = 'Копировать'; }, 1500);
    };
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => { doFeedback(); toast('Реквизиты скопированы', 'ok'); }).catch(() => toast('Ошибка копирования', 'err'));
    } else {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      doFeedback(); toast('Реквизиты скопированы', 'ok');
    }
    return;
  }
  if (a === 'rate') {
    const order = state.orders.find(o => o.id === state.openOrderId);
    if (!order) return;
    order.reviewStars = +el.dataset.v;
    $$('#reviewStars span').forEach((s, i) => s.classList.toggle('on', i < order.reviewStars));
    return;
  }
  if (a === 'submit-review') {
    const order = state.orders.find(o => o.id === el.dataset.order);
    if (!order) return;
    const stars = order.reviewStars || 5;
    const text = ($('#reviewText')?.value || '').trim() || 'Без комментария';
    if (!state.reviews[order.merchant.name]) state.reviews[order.merchant.name] = [];
    state.reviews[order.merchant.name].unshift({ stars, text, time: nowTime(), ts: Date.now(), from: 'Вы' });
    order.reviewed = true;
    order.merchant.rating = (order.merchant.rating * order.merchant.trades + stars) / (order.merchant.trades + 1);
    order.merchant.trades += 1;
    toast('Отзыв оставлен', 'ok');
    checkMissions();
    refreshOrderUI(order);
    return;
  }
  if (a === 'download-poster') { const order = state.orders.find(o => o.id === el.dataset.order); if (order) downloadPoster(order); return; }
  if (a === 'export-csv') { exportCSV(); return; }
  if (a === 'orders-page') { state.ordersPage = +el.dataset.page; renderOrders(); return; }
  if (a === 'del-ad') { state.myAds = state.myAds.filter(x => x.id !== +el.dataset.ad); save(); toast('Объявление удалено'); renderMyAds(); return; }
  if (a === 'restock-ad') {
    const ad = state.myAds.find(x => x.id === +el.dataset.ad);
    if (!ad) return;
    ad.amount = ad.originalAmount || 1000; ad.createdAt = Date.now();
    save(); toast('Объявление обновлено', 'ok'); renderMyAds();
    return;
  }
  if (a === 'open-price-alert') { openPriceAlertModal(); return; }
  if (a === 'add-alert') {
    const price = parseFloat($('#alertPrice').value);
    if (!price || price <= 0) return toast('Введите цену', 'err');
    const dir = $('#modalRoot')._alertDir || 'below';
    state.priceAlerts.push({ price, direction: dir, created: Date.now() });
    save(); toast(`Алерт: ${dir === 'below' ? '↓' : '↑'} ${n2(price)} ₽`, 'ok'); openPriceAlertModal();
    return;
  }
  if (a === 'del-alert') { state.priceAlerts.splice(+el.dataset.idx, 1); save(); openPriceAlertModal(); return; }
  if (a === 'toggle-theme') { applyTheme(state.theme === 'dark' ? 'light' : 'dark'); return; }
  if (a === 'toggle-theme-switch') { applyTheme(state.theme === 'dark' ? 'light' : 'dark'); renderProfile(); return; }
  if (a === 'toggle-hide') { state.hiddenBalance = !state.hiddenBalance; renderWallet(); save(); return; }
  if (a === 'toggle-hide-switch') { state.hiddenBalance = !state.hiddenBalance; renderWallet(); renderProfile(); save(); return; }
  if (a === 'toggle-sound') { state.sound = !state.sound; renderProfile(); save(); if (state.sound) beep(660, 0.12, 0.06); toast(state.sound ? 'Звук включён' : 'Звук выключен'); return; }
  if (a === 'toggle-sms') { state.smsSim = !state.smsSim; renderProfile(); save(); toast(state.smsSim ? 'СМС включена' : 'СМС выключена'); return; }
  if (a === 'reset') {
    askConfirm({ title: 'Сбросить всё?', message: 'Баланс, сделки, объявления и достижения будут удалены.', yesLabel: 'Сбросить', danger: true })
      .then(ok => { if (!ok) return; localStorage.removeItem(SAVE_KEY); location.reload(); });
    return;
  }
  if (a === 'onboard-next') {
    if (onboardIdx < ONBOARD_STEPS.length - 1) { onboardIdx++; renderOnboard(); } else closeOnboarding();
    return;
  }
  if (a === 'onboard-prev') { if (onboardIdx > 0) { onboardIdx--; renderOnboard(); } return; }
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') { if (e.key === 'Escape') closeModal(); return; }
  if (e.key === 'Escape') { closeModal(); return; }
  if (e.ctrlKey && e.key === 'k') { e.preventDefault(); const s = $('#fSearch'); if (s) s.focus(); return; }
  if (e.ctrlKey && e.key === 'n') { e.preventDefault(); openNotificationsModal(); return; }
  const tabMap = { '1': 'buy', '2': 'sell', '3': 'myads', '4': 'orders', '5': 'profile' };
  if (tabMap[e.key]) {
    $$('#tabs button, .mobile-nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tabMap[e.key]));
    state.tab = tabMap[e.key]; renderAll();
  }
});

$$('#tabs button, .mobile-nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('#tabs button, .mobile-nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === btn.dataset.tab));
    state.tab = btn.dataset.tab; state.ordersPage = 1; renderAll();
  });
});

/* ============ INIT ============ */
load();
applyTheme(state.theme);
updateStreak();
genAds();
for (let i = 0; i < 10; i++) state.priceHistory.push({ t: Date.now() - (10 - i) * 30000, p: getAvgMarketPrice() + rnd(-0.3, 0.3) });
renderAll();
renderBell();
if (!state.onboarded) showOnboarding();

setInterval(tick, 1000);
setInterval(maybeIncomingOrder, 22000);
setInterval(() => {
  if (state.tab !== 'buy' && state.tab !== 'sell') return;
  const ad = pick(state.ads);
  if (!ad) return;
  const old = ad.price;
  ad.price = +Math.max(88, ad.price + rnd(-0.06, 0.06)).toFixed(2);
  ad.trend = ad.price >= old ? 'up' : 'down';
  updateAdPricesInDOM();
  pushPriceHistory();
  renderSparkline();
}, 5000);
setInterval(triggerMarketEvent, 90000);
</script>
</body>
